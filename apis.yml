name: Filed
description: >-
  Filed is an AI tax platform for accounting firms and tax professionals. It reads
  source documents (W-2s, 1099s, K-1s, brokerage statements, prior-year returns),
  compares them line by line against the draft return to catch errors and find
  optimizations, performs actual data entry into professional tax software (Drake,
  ProConnect, UltraTax, CCH Axcess, Lacerte, ProSeries), and evaluates 120+ tax
  strategies to produce client-ready tax plans with citations. Firms keep the tax
  software they already use; Filed sits inside the existing workflow via three
  products — Filed Reviewer, Filed Prep, and Filed Tax Planner. Filed exposes a
  GraphQL API (router.apps.filed.com/graphql), a remote MCP server, and an
  embeddable binder UI. Backed by Northzone, Day One Ventures, and Neo.
